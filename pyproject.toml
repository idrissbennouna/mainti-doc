[project]
name = "manti-doc"
version = "0.1.0"
description = "Assistant documentaire multimodal et agentique pour la maintenance (MAINTiDOC)."
readme = "README.md"
authors = [
    { name = "idriss bennouna", email = "idrissbennouna76@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
manti-doc = "manti_doc:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
